{% extends "store/base.html" %}

{% block title %}Регистрация — ARTERRA{% endblock %}

{% block content %}

<section class="section">

    <div class="container">

        <div class="auth-card">

            <span class="section-label">
                ACCOUNT
            </span>

            <h1>
                Создать аккаунт.
            </h1>

            {% if errors %}<div class="form-error" role="alert"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Имя пользователя
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        value="{{ username_value|default:'' }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        value="{{ email_value|default:'' }}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Пароль
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password_confirm">
                        Повторите пароль
                    </label>

                    <input
                        type="password"
                        name="password_confirm"
                        id="password_confirm"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Зарегистрироваться
                </button>

            </form>

        </div>

    </div>

</section>

{% endblock %}
